<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>經典夾娃娃機 Claw Machine</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #2c3e50;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #f1c40f;
      text-shadow: 2px 2px #000;
    }
    #game-container {
      position: relative;
      background: #34495e;
      border: 10px solid #e74c3c;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      background: #87CEEB;
      border: 4px solid #2c3e50;
      border-radius: 5px;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #e67e22;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px #d35400;
      transition: all 0.1s ease;
    }
    button:active {
      box-shadow: 0 0 #d35400;
      transform: translateY(4px);
    }
    button:disabled {
      background: #7f8c8d;
      box-shadow: 0 4px #95a5a6;
      cursor: not-allowed;
    }
    #drop-btn {
      background: #2ecc71;
      box-shadow: 0 4px #27ae60;
    }
    #drop-btn:active {
      box-shadow: 0 0 #27ae60;
    }
    #msg {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      height: 25px;
      color: #f39c12;
    }
  </style>
</head>
<body>

  <h1> Arcade Claw Machine </h1>
  
  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div class="controls">
      <button id="left-btn">← 左移</button>
      <button id="drop-btn">下爪！</button>
      <button id="right-btn">右移 →</button>
    </div>

    <div id="msg">提示：滑鼠按按鈕或用鍵盤方向鍵操作！</div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');

// 遊戲狀態與參數
const STATE = { READY: 0, MOVING_DOWN: 1, CLAWING: 2, MOVING_UP: 3, RETURNING: 4, RELEASING: 5 };
let currentState = STATE.READY;

// 機台邊界與洞口設定
const chuteWidth = 80;
const chuteHeight = 60;

// 爪子物件
const claw = {
  x: canvas.width / 2,
  y: 50,
  minY: 50,
  maxY: canvas.height - 100,
  speedX: 3,
  speedY: 3,
  angle: 0.3, // 爪子張開角度
  targetAngle: 0.3,
  grabbedDoll: null
};

// 娃娃類別
class Doll {
  constructor(x, y, color, radius = 22) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.radius = radius;
    this.isGrabbed = false;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    // 畫娃娃眼睛
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(this.x - 7, this.y - 5, 3, 0, Math.PI * 2);
    ctx.arc(this.x + 7, this.y - 5, 3, 0, Math.PI * 2);
    ctx.fill();

    // 腮紅
    ctx.fillStyle = 'rgba(255, 100, 100, 0.5)';
    ctx.beginPath();
    ctx.arc(this.x - 10, this.y + 3, 4, 0, Math.PI * 2);
    ctx.arc(this.x + 10, this.y + 3, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 產生娃娃池
let dolls = [];
const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#9b59b6', '#1abc9c', '#ff78ae'];

function initDolls() {
  dolls = [];
  // 底部鋪滿娃娃
  for (let i = 0; i < 10; i++) {
    const x = chuteWidth + 25 + Math.random() * (canvas.width - chuteWidth - 50);
    const y = canvas.height - 25 - (Math.random() * 40);
    const color = colors[Math.floor(Math.random() * colors.length)];
    dolls.push(new Doll(x, y, color));
  }
}

// 繪製背景與取物口
function drawEnvironment() {
  // 繪製取物牆（洞口分隔板）
  ctx.fillStyle = '#7f8c8d';
  ctx.fillRect(chuteWidth, canvas.height - chuteHeight, 8, chuteHeight);

  // 取物洞口區域
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(0, canvas.height - chuteHeight, chuteWidth, chuteHeight);
  ctx.fillStyle = '#fff';
  ctx.font = '14px Arial';
  ctx.fillText('取物口', 18, canvas.height - 25);
}

// 繪製爪子與繩子
function drawClaw() {
  // 畫頂部繩子
  ctx.beginPath();
  ctx.moveTo(claw.x, 0);
  ctx.lineTo(claw.x, claw.y);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#333';
  ctx.stroke();

  // 畫爪子關節
  ctx.fillStyle = '#f39c12';
  ctx.fillRect(claw.x - 12, claw.y - 10, 24, 15);

  // 動態爪臂
  ctx.save();
  ctx.translate(claw.x, claw.y + 5);
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#d35400';

  // 左爪
  ctx.beginPath();
  ctx.rotate(-claw.angle);
  ctx.moveTo(0, 0);
  ctx.lineTo(-15, 25);
  ctx.lineTo(-5, 40);
  ctx.stroke();

  // 右爪
  ctx.rotate(claw.angle * 2);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(15, 25);
  ctx.lineTo(5, 40);
  ctx.stroke();

  ctx.restore();
}

// 鍵盤操控支援
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// 按鈕操控綁定
const leftBtn = document.getElementById('left-btn');
const rightBtn = document.getElementById('right-btn');
const dropBtn = document.getElementById('drop-btn');

let isLeftPressed = false;
let isRightPressed = false;

leftBtn.addEventListener('mousedown', () => isLeftPressed = true);
leftBtn.addEventListener('mouseup', () => isLeftPressed = false);
leftBtn.addEventListener('touchstart', () => isLeftPressed = true);
leftBtn.addEventListener('touchend', () => isLeftPressed = false);

rightBtn.addEventListener('mousedown', () => isRightPressed = true);
rightBtn.addEventListener('mouseup', () => isRightPressed = false);
rightBtn.addEventListener('touchstart', () => isRightPressed = true);
rightBtn.addEventListener('touchend', () => isRightPressed = false);

dropBtn.addEventListener('click', startDrop);

function startDrop() {
  if (currentState === STATE.READY) {
    currentState = STATE.MOVING_DOWN;
    claw.targetAngle = 0.6; // 下降時張開爪子
    msg.innerText = "爪子下沉中...";
  }
}

// 遊戲邏輯更新
function update() {
  // 1. 準備階段（左右移動）
  if (currentState === STATE.READY) {
    if ((keys['ArrowLeft'] || isLeftPressed) && claw.x > chuteWidth / 2) {
      claw.x -= claw.speedX;
    }
    if ((keys['ArrowRight'] || isRightPressed) && claw.x < canvas.width - 20) {
      claw.x += claw.speedX;
    }
    if (keys['Space'] || keys['ArrowDown']) {
      startDrop();
    }
  }

  // 平滑過渡爪子角度
  claw.angle += (claw.targetAngle - claw.angle) * 0.1;

  // 2. 下降階段
  if (currentState === STATE.MOVING_DOWN) {
    claw.y += claw.speedY;

    // 檢查是否碰到娃娃或底部
    let hitDoll = dolls.find(d => Math.hypot(d.x - claw.x, d.y - (claw.y + 35)) < 25);

    if (claw.y >= claw.maxY || hitDoll) {
      currentState = STATE.CLAWING;
      msg.innerText = "收攏爪子！";
      setTimeout(() => {
        // 嘗試抓取
        if (hitDoll && Math.random() < 0.75) { // 75% 抓取成功率
          claw.grabbedDoll = hitDoll;
          hitDoll.isGrabbed = true;
          msg.innerText = "抓到了！往上拉...";
        } else if (hitDoll) {
          msg.innerText = "哎呀！滑掉了！";
        }
        claw.targetAngle = 0.15; // 夾緊爪子
        currentState = STATE.MOVING_UP;
      }, 600);
    }
  }

  // 3. 上升階段
  if (currentState === STATE.MOVING_UP) {
    claw.y -= claw.speedY;

    // 隨機甩落機制 (模擬真實夾娃娃機防夾爪鬆脫)
    if (claw.grabbedDoll && claw.y > 150 && Math.random() < 0.008) {
      claw.grabbedDoll.isGrabbed = false;
      claw.grabbedDoll = null;
      msg.innerText = "可惡！掉下去了！";
    }

    if (claw.grabbedDoll) {
      claw.grabbedDoll.x = claw.x;
      claw.grabbedDoll.y = claw.y + 35;
    }

    if (claw.y <= claw.minY) {
      currentState = STATE.RETURNING;
      msg.innerText = "回歸洞口上方...";
    }
  }

  // 4. 返回洞口上方
  if (currentState === STATE.RETURNING) {
    const targetX = chuteWidth / 2;
    if (claw.x > targetX) {
      claw.x -= claw.speedX;
      if (claw.grabbedDoll) {
        claw.grabbedDoll.x = claw.x;
      }
    } else {
      currentState = STATE.RELEASING;
    }
  }

  // 5. 放開爪子
  if (currentState === STATE.RELEASING) {
    claw.targetAngle = 0.5;
    if (claw.grabbedDoll) {
      // 娃娃掉落洞口
      claw.grabbedDoll.y += 5;
      if (claw.grabbedDoll.y > canvas.height - 20) {
        // 成功獲得！移除娃娃
        dolls = dolls.filter(d => d !== claw.grabbedDoll);
        claw.grabbedDoll = null;
        msg.innerText = "🎉 恭喜抓到娃娃了！";
      }
    } else {
      msg.innerText = "沒抓到，再試一次吧！";
    }

    setTimeout(() => {
      claw.targetAngle = 0.3;
      currentState = STATE.READY;
      if (dolls.length < 5) initDolls(); // 娃娃太少時補充
    }, 1200);
  }
}

// 主繪製迴圈
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawEnvironment();

  // 繪製所有娃娃
  dolls.forEach(doll => doll.draw());

  // 繪製爪子
  drawClaw();

  update();
  requestAnimationFrame(draw);
}

// 初始化遊戲
initDolls();
draw();
</script>
</body>
</html>
